[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "One call() to a language model with routing, PII redaction, injection check, rate limit, budget, and audit fields."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Toyin O. Bakare" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
google = ["google-genai>=1.0"]
all = ["anthropic>=0.40", "openai>=1.50", "google-genai>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Toyin-Bakare/llm-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
